name: Publish Alas downstream

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full commit at the head of the protected alas branch
        required: true
        type: string
      upstream_tag:
        description: Exact stable upstream tag (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-alas
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/alas' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      source_commit: ${{ steps.source.outputs.commit }}
      upstream_version: ${{ steps.source.outputs.upstream_version }}
      upstream_commit: ${{ steps.source.outputs.upstream_commit }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: alas
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Initialize durable report
        run: |
          REPORT_DIR="$RUNNER_TEMP/alas-publish"
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$REPORT_DIR"
          : > "$REPORT_DIR/summary.md"
      - name: Verify source, upstream release, and sync review
        id: source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UPSTREAM_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin refs/heads/alas:refs/remotes/origin/alas
          test "$SOURCE_COMMIT" = "$(git rev-parse origin/alas)"
          git checkout --detach "$SOURCE_COMMIT"
          upstream_version="$(node -p "require('./package.json').version")"
          test "$UPSTREAM_TAG" = "v$upstream_version"
          git fetch --no-tags https://github.com/agentclientprotocol/claude-agent-acp.git \
            '+refs/heads/main:refs/remotes/alas-upstream/main' \
            "refs/tags/$UPSTREAM_TAG:refs/alas-upstream-tag"
          upstream_commit="$(git rev-parse 'refs/alas-upstream-tag^{commit}')"
          gh api "repos/agentclientprotocol/claude-agent-acp/releases/tags/$UPSTREAM_TAG" \
            > "$REPORT_DIR/github-release.json"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@agentclientprotocol%2Fclaude-agent-acp');
          if (!response.ok) throw new Error(`upstream npm registry returned ${response.status}`);
          writeFileSync(`${process.env.REPORT_DIR}/npm-metadata.json`, JSON.stringify(await response.json()));
          NODE
          node scripts/verify-upstream-release.mjs \
            --tag "$UPSTREAM_TAG" \
            --commit "$upstream_commit" \
            --github-release "$REPORT_DIR/github-release.json" \
            --npm-metadata "$REPORT_DIR/npm-metadata.json" \
            --allow-current true \
            --output "$REPORT_DIR/upstream-release.json"
          node scripts/verify-alas-source.mjs \
            --source-commit "$SOURCE_COMMIT" \
            --upstream-main-ref refs/remotes/alas-upstream/main \
            --stable-tag-ref refs/alas-upstream-tag \
            --declared-tag "$UPSTREAM_TAG" \
            --output "$REPORT_DIR/source-verification.json"
          node scripts/verify-sync-source-review.mjs \
            --source-commit "$SOURCE_COMMIT" \
            --upstream-main-ref refs/remotes/alas-upstream/main \
            --target-ref refs/alas-upstream-tag \
            --target-tag "$UPSTREAM_TAG" \
            --review docs/ALAS_SYNC_REVIEW.json \
            --ledger docs/ALAS_DOWNSTREAM_PATCHES.json \
            > "$REPORT_DIR/source-review-verification.json"
          previous_alas="$(node -p "require('$REPORT_DIR/source-review-verification.json').previousAlas")"
          git show "$previous_alas:docs/ALAS_DOWNSTREAM_PATCHES.json" \
            > "$REPORT_DIR/review-ledger.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const review = JSON.parse(readFileSync('docs/ALAS_SYNC_REVIEW.json', 'utf8'));
          writeFileSync(
            `${process.env.REPORT_DIR}/preserved.json`,
            `${JSON.stringify(review.preservedCommits.map(({ commit, subject, constituentCommits }) => ({ commit, subject, constituentCommits })), null, 2)}\n`,
          );
          NODE
          node scripts/audit-downstream-patches.mjs \
            --target-ref refs/alas-upstream-tag \
            --target-tag "$UPSTREAM_TAG" \
            --ledger "$REPORT_DIR/review-ledger.json" \
            --json "$REPORT_DIR/audit.json" \
            --markdown "$REPORT_DIR/audit.md" || test "$?" -eq 2
          node scripts/sync-review.mjs \
            --mode verify \
            --audit "$REPORT_DIR/audit.json" \
            --review docs/ALAS_SYNC_REVIEW.json \
            --preserved "$REPORT_DIR/preserved.json" \
            --advanced-ledger docs/ALAS_DOWNSTREAM_PATCHES.json \
            --previous-ledger "$REPORT_DIR/review-ledger.json" \
            > "$REPORT_DIR/review-verification.json"
          test "$(node -p "require('./docs/ALAS_DOWNSTREAM_PATCHES.json').baseTag")" = "$UPSTREAM_TAG"
          {
            echo "## Publication preflight passed"
            echo
            echo "Source \`$SOURCE_COMMIT\`, upstream release \`$UPSTREAM_TAG\`, npm metadata, exact merge-base, and \`docs/ALAS_SYNC_REVIEW.json\` agree."
          } >> "$REPORT_DIR/summary.md"
          echo "ALAS_UPSTREAM_VERSION=$upstream_version" >> "$GITHUB_ENV"
          echo "ALAS_UPSTREAM_COMMIT=$upstream_commit" >> "$GITHUB_ENV"
          echo "ALAS_SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:run
      - name: Read published manifests
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@alas-ide%2Fclaude-agent-acp');
          if (!response.ok && response.status !== 404) {
            throw new Error(`npm registry returned ${response.status}`);
          }
          writeFileSync(`${process.env.REPORT_DIR}/published.json`, JSON.stringify(response.status === 404 ? [] : await response.json()));
          NODE
      - name: Prepare package
        id: prepare
        run: |
          ALAS_PUBLISHED_JSON="$(cat "$REPORT_DIR/published.json")" \
            node scripts/prepare-alas-package.mjs > "$REPORT_DIR/prepared.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const { version, alreadyPublished } = JSON.parse(readFileSync(`${process.env.REPORT_DIR}/prepared.json`, 'utf8'));
          console.log(`version=${version}`);
          console.log(`alreadyPublished=${alreadyPublished}`);
          NODE
      - name: Check package contents
        run: |
          npm pack --dry-run --json > "$REPORT_DIR/pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const [{ files }] = JSON.parse(readFileSync(`${process.env.REPORT_DIR}/pack.json`, 'utf8'));
          const paths = files.map(file => file.path);
          const required = ['dist/index.js', 'dist/lib.js', 'dist/lib.d.ts'];
          const allowed = path => manifest.files.includes(path) || (
            manifest.files.includes('dist/') && path.startsWith('dist/') && !path.startsWith('dist/tests/')
          );
          if (required.some(path => !paths.includes(path)) || paths.some(path => !allowed(path))) {
            throw new Error(`Unexpected package contents: ${paths.join(', ')}`);
          }
          NODE
      - name: Publish
        if: ${{ steps.prepare.outputs.alreadyPublished != 'true' }}
        run: npm publish --access public --provenance --tag latest
      - name: Write durable publication summary
        if: ${{ always() }}
        run: |
          {
            if [ -s "$REPORT_DIR/summary.md" ]; then
              cat "$REPORT_DIR/summary.md"
            else
              echo "## Publication failed before a detailed report was produced"
            fi
            echo
            echo "Workflow conclusion: \`${{ job.status }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.publish.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}
          UPSTREAM_VERSION: ${{ needs.publish.outputs.upstream_version }}
          UPSTREAM_COMMIT: ${{ needs.publish.outputs.upstream_commit }}
        run: |
          set -Eeuo pipefail
          test -n "$VERSION"
          test -n "$SOURCE_COMMIT"
          test -n "$UPSTREAM_VERSION"
          test -n "$UPSTREAM_COMMIT"
          tag="alas-v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$SOURCE_COMMIT" || {
              echo "::error::Existing $tag points to another commit; refusing to move it."
              exit 1
            }
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$SOURCE_COMMIT"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --target "$SOURCE_COMMIT" --title "$tag" \
              --notes "npm: @alas-ide/claude-agent-acp@$VERSION. Upstream tag: v$UPSTREAM_VERSION. Upstream commit: $UPSTREAM_COMMIT. Source commit: $SOURCE_COMMIT."
          fi
      - name: Write durable release summary
        if: ${{ always() }}
        run: |
          {
            echo "## Alas tag and release"
            echo
            echo "Source: \`${{ needs.publish.outputs.source_commit }}\`."
            echo "Workflow conclusion: \`${{ job.status }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
