name: Sync stable upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'mrmans0n/claude-agent-acp' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: alas
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Select newest stable upstream tag
        id: select
        run: |
          git fetch origin refs/heads/alas:refs/remotes/origin/alas \
            '+refs/tags/alas-v*:refs/tags/alas-v*'
          git fetch --no-tags https://github.com/agentclientprotocol/claude-agent-acp.git \
            '+refs/heads/main:refs/remotes/alas-upstream/main' \
            '+refs/tags/*:refs/alas-upstream-tags/*'
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&base=alas&per_page=100" \
            > /tmp/alas-open-pulls.json
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process';
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { selectUpstreamSync } from './scripts/select-upstream-sync.mjs';
          const refs = execFileSync('git', ['for-each-ref', '--format=%(refname)', 'refs/alas-upstream-tags/'], { encoding: 'utf8' });
          const tags = refs.trim().split('\n').filter(Boolean).map(ref => {
            const result = spawnSync('git', ['merge-base', '--is-ancestor', ref, 'origin/alas']);
            if (result.status !== 0 && result.status !== 1) throw new Error(`Cannot check ancestry of ${ref}`);
            return { name: ref.slice('refs/alas-upstream-tags/'.length), merged: result.status === 0 };
          });
          const pulls = JSON.parse(readFileSync('/tmp/alas-open-pulls.json', 'utf8')).flat()
            .filter(pr => pr.head.repo?.full_name === process.env.GITHUB_REPOSITORY);
          writeFileSync('/tmp/alas-sync-pulls.json', JSON.stringify(pulls));
          const selection = selectUpstreamSync({ tags, openHeads: pulls.map(pr => pr.head.ref) });
          if (selection) {
            writeFileSync('/tmp/alas-sync-selection.json', JSON.stringify(selection));
            appendFileSync(process.env.GITHUB_OUTPUT, `tag=${selection.tag}\nbranch=${selection.branch}\n`);
          }
          NODE
      - name: Audit downstream patches
        if: ${{ steps.select.outputs.tag != '' }}
        id: audit
        env:
          TAG: ${{ steps.select.outputs.tag }}
        run: |
          set +e
          node scripts/audit-downstream-patches.mjs \
            --target-ref "refs/alas-upstream-tags/$TAG" \
            --ledger docs/ALAS_DOWNSTREAM_PATCHES.json \
            --json /tmp/alas-patch-audit.json \
            --markdown /tmp/alas-patch-audit.md
          status=$?
          set -e
          cat /tmp/alas-patch-audit.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 2 ]; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Preserve manual review in an existing draft PR
        if: ${{ steps.audit.outputs.manual == 'true' }}
        env:
          TAG: ${{ steps.select.outputs.tag }}
          BRANCH: ${{ steps.select.outputs.branch }}
        run: |
          pr="$(jq -r --arg branch "$BRANCH" '[.[] | select(.head.ref == $branch)][0].number // empty' /tmp/alas-sync-pulls.json)"
          if [ -n "$pr" ]; then
            {
              cat /tmp/alas-patch-audit.md
              echo
              echo "Automation stopped before rebuilding or pushing this branch. Resolve the ledger classification, then rerun sync."
            } > /tmp/alas-sync-pr.md
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title "chore: review upstream $TAG" --body-file /tmp/alas-sync-pr.md
            gh pr ready "$pr" --repo "$GITHUB_REPOSITORY" --undo || true
          fi
      - name: Build exact-tag sync candidate
        if: ${{ steps.select.outputs.tag != '' && steps.audit.outputs.manual != 'true' }}
        id: build
        env:
          TAG: ${{ steps.select.outputs.tag }}
          BRANCH: ${{ steps.select.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          {
            echo "$BRANCH"
            jq -r '.staleHeads[]' /tmp/alas-sync-selection.json
          } | sort -u > /tmp/alas-sync-heads.txt
          : > /tmp/alas-sync-ref-args.txt
          : > /tmp/alas-sync-expected-branch-head
          : > /tmp/alas-sync-expected-heads.tsv
          while read -r head; do
            remote="$(git ls-remote --heads origin "refs/heads/$head" | awk '{print $1}')"
            if [ -n "$remote" ]; then
              git fetch origin "+refs/heads/$head:refs/remotes/origin/$head"
              printf '%s\n' "--sync-ref" "refs/remotes/origin/$head=$remote" >> /tmp/alas-sync-ref-args.txt
              printf '%s\t%s\n' "$head" "$remote" >> /tmp/alas-sync-expected-heads.tsv
              if [ "$head" = "$BRANCH" ]; then
                printf '%s' "$remote" > /tmp/alas-sync-expected-branch-head
              fi
            fi
          done < /tmp/alas-sync-heads.txt
          mapfile -t sync_args < /tmp/alas-sync-ref-args.txt
          set +e
          node scripts/build-sync-candidate.mjs \
            --target-ref "refs/alas-upstream-tags/$TAG" \
            --alas-ref refs/remotes/origin/alas \
            --upstream-main-ref refs/remotes/alas-upstream/main \
            --branch "$BRANCH" \
            --output /tmp/alas-sync-candidate.json \
            "${sync_args[@]}" > /tmp/alas-sync-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "## Sync candidate build failed for $TAG"
              echo
              echo '```text'
              cat /tmp/alas-sync-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const tag = process.env.TAG;
          const path = 'docs/ALAS_DOWNSTREAM_PATCHES.json';
          const ledger = JSON.parse(readFileSync(path, 'utf8'));
          ledger.baseTag = tag;
          writeFileSync(path, `${JSON.stringify(ledger, null, 2)}\n`);
          NODE
          git add docs/ALAS_DOWNSTREAM_PATCHES.json
          git commit -m "chore: advance downstream patch ledger to $TAG"
          git diff --name-only origin/alas HEAD -- .github/workflows > /tmp/alas-sync-workflows.txt
          if [ -s /tmp/alas-sync-workflows.txt ]; then
            {
              echo "## Manual workflow review required for $TAG"
              echo
              echo "The exact-tag candidate changes workflow files and was not pushed:"
              sed 's/^/- `/' /tmp/alas-sync-workflows.txt | sed 's/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "workflow_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push candidate with lease
        if: ${{ steps.build.outputs.failed != 'true' && steps.build.outputs.workflow_changes != 'true' && steps.select.outputs.tag != '' && steps.audit.outputs.manual != 'true' }}
        env:
          BRANCH: ${{ steps.select.outputs.branch }}
        run: |
          while IFS=$'\t' read -r head expected; do
            current="$(git ls-remote --heads origin "refs/heads/$head" | awk '{print $1}')"
            if [ "$current" != "$expected" ]; then
              {
                echo "## Concurrent sync-branch update detected"
                echo
                echo "\`$head\` moved from \`$expected\` to \`${current:-deleted}\`. No candidate was pushed."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done < /tmp/alas-sync-expected-heads.tsv
          EXPECTED_BRANCH_HEAD="$(cat /tmp/alas-sync-expected-branch-head)"
          if [ -n "$EXPECTED_BRANCH_HEAD" ]; then
            git push origin "HEAD:refs/heads/$BRANCH" \
              "--force-with-lease=refs/heads/$BRANCH:$EXPECTED_BRANCH_HEAD"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
      - name: Create or update persistent draft sync PR
        if: ${{ steps.build.outputs.failed != 'true' && steps.build.outputs.workflow_changes != 'true' && steps.select.outputs.tag != '' && steps.audit.outputs.manual != 'true' }}
        env:
          TAG: ${{ steps.select.outputs.tag }}
          BRANCH: ${{ steps.select.outputs.branch }}
        run: |
          pr="$(jq -r --arg branch "$BRANCH" '[.[] | select(.head.ref == $branch)][0].number // empty' /tmp/alas-sync-pulls.json)"
          {
            cat /tmp/alas-patch-audit.md
            echo
            echo "This branch was rebuilt from the exact stable tag and contains only reapplied downstream commits plus preserved sync-only edits."
            echo "Do not merge this PR normally: that would retain contaminated history from alas. After review and CI, replace alas with this exact head using a maintainer force-with-lease, then close the PR."
            echo "Publication remains a separate manual environment-approved workflow."
          } > /tmp/alas-sync-pr.md
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title "chore: sync upstream $TAG" --body-file /tmp/alas-sync-pr.md
            gh pr ready "$pr" --repo "$GITHUB_REPOSITORY" --undo || true
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base alas --head "$BRANCH" --draft \
              --title "chore: sync upstream $TAG" --body-file /tmp/alas-sync-pr.md
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          {
            echo
            echo "## Candidate created"
            echo
            echo "Draft PR head: \`$BRANCH\`. Older sync PRs and branches were left intact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail closed when manual work is required
        if: ${{ steps.audit.outputs.manual == 'true' || steps.build.outputs.failed == 'true' || steps.build.outputs.workflow_changes == 'true' }}
        run: |
          echo "::error::Stable upstream synchronization requires manual review; see the job summary."
          exit 1
